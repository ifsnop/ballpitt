<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ball Physics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0a0a0f; overflow: hidden;
    width: 100%; height: 100%;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }
  #rotate-msg {
    display: none; position: fixed; inset: 0;
    background: #0a0a0f; z-index: 999;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; color: #00ff78; text-align: center; padding: 32px;
  }
  #rotate-msg.show { display: flex; }
  #rotate-msg svg  { animation: spin 2s linear infinite; }
  @keyframes spin  { to { transform: rotate(360deg); } }
  #rotate-msg p    { font-size: 14px; opacity: 0.7; letter-spacing: 0.1em; }

  #debug {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(0,255,120,0.07);
    border-bottom: 1px solid rgba(0,255,120,0.18);
    padding: 3px 8px; font-size: 10px; color: #00ff78;
    letter-spacing: 0.04em;
    display: flex; flex-wrap: wrap; align-items: center;
    backdrop-filter: blur(4px); line-height: 1.65;
  }
  .dg { display: flex; align-items: center; gap: 3px; margin-right: 2px; }
  .dl { opacity: 0.4; font-size: 9px; }
  .dv { font-weight: bold; font-size: 10px; min-width: 34px; }
  .ds { opacity: 0.18; margin: 0 5px; }

  #fps-box {
    position: fixed; bottom: 8px; right: 10px; z-index: 100;
    font-family: 'Courier New', monospace;
    font-size: 10px; color: #00ff78; opacity: 0.55;
    letter-spacing: 0.05em; pointer-events: none;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  #gl  { z-index: 1; }
  #c2d { z-index: 2; }

  #permission-overlay {
    position: fixed; inset: 0; background: #0a0a0f;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px; z-index: 300; padding: 32px;
  }
  #permission-overlay h1 { font-size: 20px; color: #00ff78; letter-spacing: 0.12em; text-align: center; }
  #permission-overlay p  { font-size: 13px; color: rgba(0,255,120,0.6); text-align: center; line-height: 1.7; max-width: 320px; }
  #btn-start {
    background: transparent; border: 1.5px solid #00ff78; color: #00ff78;
    font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 0.15em;
    padding: 14px 36px; cursor: pointer; text-transform: uppercase;
    transition: background .2s, color .2s; -webkit-tap-highlight-color: transparent;
  }
  #btn-start:active { background: #00ff78; color: #0a0a0f; }
</style>
</head>
<body>

<div id="rotate-msg">
  <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
    <rect x="10" y="6" width="28" height="36" rx="4" stroke="#00ff78" stroke-width="2"/>
    <path d="M32 2 L38 8 L32 14" stroke="#00ff78" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="38" y1="8" x2="24" y2="8" stroke="#00ff78" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <p>GIRA EL MÓVIL<br>A MODO APAISADO</p>
</div>

<div id="permission-overlay">
  <h1>BALL PHYSICS</h1>
  <p>Inclina el móvil para controlar la bola con física real basada en el acelerómetro.</p>
  <button id="btn-start">INICIAR</button>
</div>

<canvas id="gl"></canvas>
<canvas id="c2d"></canvas>
<div id="debug">cargando...</div>
<div id="fps-box">FPS —</div>

<script>
const { Engine, Runner, Bodies, Composite } = Matter;

// ── Constants ──────────────────────────────────────────────────────────────
const WALL         = 40;
const RADIUS       = 44;
const RESTITUTION  = 0.88;
const FRICTION     = 0.0005;
const FRICTION_AIR = 0.003;
const ALPHA        = 0.18;

// ── State ──────────────────────────────────────────────────────────────────
let W, H;
let engine, runner, ball;
let ctx2d, glState;
let ax = 0, ay = 0, az = 0;   // raw filtered sensor values
let sensorOk = false;
let fps = 0, lastTime = performance.now(), frameCount = 0;
let drawLoopId = null;
let hasGoneLandscape = false;

// ── Orientation angle ──────────────────────────────────────────────────────
// We read screen.orientation.angle (0, 90, 180, 270) to remap axes.
// 0   = portrait-primary       (phone upright, home bottom)
// 90  = landscape-secondary    (home left  — rotated CW from portrait)
// 270 = landscape-primary      (home right — rotated CCW from portrait)
// 180 = portrait-secondary     (upside-down)
function getOrientAngle() {
  if (screen.orientation && screen.orientation.angle !== undefined)
    return screen.orientation.angle;
  return (window.orientation || 0);  // legacy fallback
}

// Given raw device accelerometer (a.x, a.y) and screen orientation angle,
// return { gx, gy } that correctly drives gravity in screen-space.
//
// Device axes are FIXED to the physical device regardless of how the screen
// rotates. When the screen rotates, the mapping from device axes to screen
// axes changes:
//
//   angle=0   (portrait)     : screen-X = +devX, screen-Y = -devY
//   angle=90  (landscape-sec): screen-X = +devY, screen-Y = +devX  (home left)
//   angle=270 (landscape-pri): screen-X = -devY, screen-Y = -devX  (home right)
//   angle=180 (portrait inv) : screen-X = -devX, screen-Y = +devY
//
// We then negate because gravity should PULL (positive gravity = ball moves
// in that direction), and the accelerometer reads the REACTION force.
// accelerationIncludingGravity on a stationary tilted phone gives the
// component of g projected onto each axis — we want to use that directly
// as the gravity direction in game-space.
function computeGravity(rawAx, rawAy) {
  const G   = 9.8;
  const ang = ((getOrientAngle() % 360) + 360) % 360;
  let gx, gy;
  if (ang < 45 || ang >= 315) {
    // Portrait
    gx =  rawAx / G;
    gy = -rawAy / G;
  } else if (ang < 135) {
    // Landscape-secondary (home left, rotated 90° CW)
    gx =  rawAy / G;
    gy =  rawAx / G;
  } else if (ang < 225) {
    // Portrait-inverted
    gx = -rawAx / G;
    gy =  rawAy / G;
  } else {
    // Landscape-primary (home right, rotated 270° CW / 90° CCW)
    gx = -rawAy / G;
    gy = -rawAx / G;
  }
  return { gx, gy };
}

// ── Debug ──────────────────────────────────────────────────────────────────
const dbg    = document.getElementById('debug');
const fpsBox = document.getElementById('fps-box');
const rotMsg = document.getElementById('rotate-msg');

function fmt1(n) { const s = (+n).toFixed(1); return s === '-0.0' ? '0.0' : s; }
function fmt2(n) { const s = (+n).toFixed(2); return s === '-0.00' ? '0.00' : s; }
function fmt0(n) { const s = (+n).toFixed(0); return s === '-0' ? '0' : s; }
function dg(l, v) { return `<span class="dg"><span class="dl">${l}</span><span class="dv">${v}</span></span>`; }
const ds = '<span class="ds">|</span>';

function updateDebug() {
  const bx  = ball ? fmt0(ball.position.x) : '--';
  const by  = ball ? fmt0(ball.position.y) : '--';
  const vx  = ball ? fmt1(ball.velocity.x) : '--';
  const vy  = ball ? fmt1(ball.velocity.y) : '--';
  const spd = ball ? fmt1(Math.hypot(ball.velocity.x, ball.velocity.y)) : '--';
  const gx  = engine ? fmt2(engine.gravity.x) : '--';
  const gy  = engine ? fmt2(engine.gravity.y) : '--';
  const ang = getOrientAngle();
  dbg.innerHTML =
    dg('SNS', sensorOk ? '✓' : '✗') + ds +
    dg('ANG', ang) + ds +
    dg('AX', fmt1(ax)) + ds + dg('AY', fmt1(ay)) + ds + dg('AZ', fmt1(az)) + ds +
    dg('GX', gx) + ds + dg('GY', gy) + ds +
    dg('POS', `${bx},${by}`) + ds +
    dg('VEL', `${vx},${vy}`) + ds +
    dg('SPD', spd);
  fpsBox.textContent = `FPS ${fps}`;
}

function tickFPS() {
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) { fps = frameCount; frameCount = 0; lastTime = now; }
}

// ── Browser UI ─────────────────────────────────────────────────────────────
function hideBrowserUI() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).catch(()=>{});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  window.scrollTo(0, 1);
  setTimeout(() => window.scrollTo(0, 1), 300);
}

function lockLandscape() {
  if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{});
  if (screen.lockOrientation)    screen.lockOrientation('landscape');
  if (screen.mozLockOrientation) screen.mozLockOrientation('landscape');
  if (screen.msLockOrientation)  screen.msLockOrientation('landscape');
}

function checkOrientation() {
  if (hasGoneLandscape) { rotMsg.classList.remove('show'); return; }
  const isL = window.innerWidth > window.innerHeight;
  if (isL) { hasGoneLandscape = true; rotMsg.classList.remove('show'); }
  else       rotMsg.classList.add('show');
}

// ── WebGL ──────────────────────────────────────────────────────────────────
function initGL() {
  const canvas = document.getElementById('gl');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('webgl', { alpha: false }) ||
            canvas.getContext('experimental-webgl', { alpha: false });
  if (!g) return null;

  const vsrc = `
    attribute vec2 aPos;
    varying   vec2 vUv;
    void main() { vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

  // ── Fragment shader ─────────────────────────────────────────────────────
  // True sphere refraction:
  //   - For each pixel inside the ball disc, compute the 3-D surface normal
  //     of a unit sphere at that XY position.
  //   - Apply Snell's law (vector form) to find the refracted ray direction.
  //   - Project the refracted ray back to the background plane (z=0) to get
  //     the sample coordinates.
  //   This gives strong fish-eye distortion at the edges (grazing angles)
  //   and mild magnification near the centre, exactly like a glass marble.
  //
  // Halo: a soft glowing ring just outside the ball radius drawn in the
  //   background section using a smooth falloff.
  const fsrc = `
    precision highp float;
    varying vec2  vUv;
    uniform vec2  uRes;
    uniform vec2  uBall;   // ball centre in px (Y from top)
    uniform float uRadius;

    // ── Line grid ──────────────────────────────────────────────────────────
    float grid(vec2 px) {
      float gs  = 34.0;
      float lw  = 0.65;
      vec2  gv  = mod(px, gs);
      float h   = smoothstep(lw+1.0, lw, abs(gv.y));
      float v   = smoothstep(lw+1.0, lw, abs(gv.x));
      return max(h, v);
    }

    void main() {
      // Pixel coords, Y flipped to match screen (top=0)
      vec2  px  = vUv * uRes;
      px.y      = uRes.y - px.y;

      vec3  bgDark = vec3(0.040, 0.040, 0.072);
      vec3  bgLine = vec3(0.155, 0.195, 0.270);

      // Background at this pixel
      float gb  = grid(px);
      vec3  bg  = mix(bgDark, bgLine, gb);

      vec2  d   = px - uBall;
      float r   = uRadius;
      float dist= length(d);

      // ── Halo (outside ball) ────────────────────────────────────────────
      if (dist > r) {
        float haloW = r * 0.38;
        float t     = (dist - r) / haloW;
        float halo  = exp(-t * t * 4.5) * 0.38;
        // Soft blue-white halo colour
        vec3  haloCol = vec3(0.55, 0.78, 1.00);
        bg = mix(bg, bg + haloCol * halo, smoothstep(1.0, 0.0, t));
        gl_FragColor = vec4(bg, 1.0);
        return;
      }

      // ── Inside ball — sphere refraction ───────────────────────────────
      float nd = dist / r;                       // normalised radius 0..1
      float nz = sqrt(max(0.0, 1.0 - nd*nd));   // z on unit sphere surface

      // Surface normal pointing outward from sphere
      vec3 N = normalize(vec3(d / r, nz));

      // Incident ray: straight in from the viewer (screen → glass)
      vec3 I = vec3(0.0, 0.0, -1.0);

      // Snell's law (vector form):  R = eta*I + (eta*cosI - cosT)*N
      // eta = n1/n2, using n_air=1.0, n_glass≈1.55
      float eta   = 1.0 / 1.55;
      float cosI  = -dot(N, I);                  // = nz (positive)
      float sin2T = eta*eta * (1.0 - cosI*cosI);
      vec3  refr;
      if (sin2T > 1.0) {
        // Total internal reflection — mirror the incident ray
        refr = I - 2.0 * dot(I, N) * N;
      } else {
        float cosT = sqrt(1.0 - sin2T);
        refr = eta * I + (eta * cosI - cosT) * N;
      }

      // March refracted ray to the background plane (z = -depth)
      // We pick depth = 1.5*r so there is significant lateral displacement
      float depth    = 1.5 * r;
      float t_hit    = -depth / refr.z;          // refr.z is negative (going away)
      vec2  bgOffset = refr.xy * t_hit;
      vec2  samplePx = uBall + bgOffset;

      // Clamp to screen
      samplePx = clamp(samplePx, vec2(0.0), uRes);

      // Sample background at refracted position
      vec2  sPx  = samplePx;
      sPx.y      = uRes.y - sPx.y;   // re-flip for grid function
      float sg   = grid(sPx);
      vec3  sBg  = mix(bgDark, bgLine, sg);

      // Very subtle blue interior tint (more pronounced near edge)
      vec3 tint  = vec3(0.70, 0.88, 1.00) * 0.05 * (0.3 + 0.7*(1.0-nz));
      vec3 col   = sBg + tint;

      // Soft specular — small, dim, just enough to feel glassy
      vec2  sp1  = d - vec2(-r*0.36, -r*0.36);
      float s1   = exp(-dot(sp1,sp1) / (2.0*(r*0.19)*(r*0.19)));
      col       += vec3(1.0) * s1 * 0.22;

      // Tiny sharp dot
      vec2  sp2  = d + vec2(r*0.20, r*0.26);
      float s2   = exp(-dot(sp2,sp2) / (2.0*(r*0.048)*(r*0.048)));
      col       += vec3(1.0) * s2 * 0.50;

      // Edge fade (blend with background at the very rim)
      float edge = smoothstep(1.0, 0.90, nd);
      col = mix(bg, col, edge);

      gl_FragColor = vec4(col, 1.0);
    }`;

  function compile(type, src) {
    const s = g.createShader(type);
    g.shaderSource(s, src); g.compileShader(s);
    if (!g.getShaderParameter(s, g.COMPILE_STATUS)) { console.error(g.getShaderInfoLog(s)); return null; }
    return s;
  }
  const prog = g.createProgram();
  g.attachShader(prog, compile(g.VERTEX_SHADER, vsrc));
  g.attachShader(prog, compile(g.FRAGMENT_SHADER, fsrc));
  g.linkProgram(prog);
  if (!g.getProgramParameter(prog, g.LINK_STATUS)) { console.error(g.getProgramInfoLog(prog)); return null; }
  g.useProgram(prog);

  const buf = g.createBuffer();
  g.bindBuffer(g.ARRAY_BUFFER, buf);
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), g.STATIC_DRAW);
  const aPos = g.getAttribLocation(prog, 'aPos');
  g.enableVertexAttribArray(aPos);
  g.vertexAttribPointer(aPos, 2, g.FLOAT, false, 0, 0);

  return {
    g,
    uRes:    g.getUniformLocation(prog, 'uRes'),
    uBall:   g.getUniformLocation(prog, 'uBall'),
    uRadius: g.getUniformLocation(prog, 'uRadius'),
  };
}

function renderGL() {
  if (!glState) return;
  const { g, uRes, uBall, uRadius } = glState;
  g.viewport(0, 0, W, H);
  g.uniform2f(uRes, W, H);
  g.uniform2f(uBall, ball ? ball.position.x : W/2, ball ? ball.position.y : H/2);
  g.uniform1f(uRadius, RADIUS);
  g.drawArrays(g.TRIANGLE_STRIP, 0, 4);
}

// ── Build world ────────────────────────────────────────────────────────────
function buildWorld() {
  if (runner) Runner.stop(runner);
  if (engine) Composite.clear(engine.world, false);

  W = window.innerWidth;
  H = window.innerHeight;

  const c2d = document.getElementById('c2d');
  c2d.width = W; c2d.height = H;
  ctx2d = c2d.getContext('2d');

  const glCanvas = document.getElementById('gl');
  glCanvas.width = W; glCanvas.height = H;
  glState = initGL();

  engine = Engine.create({ gravity: { x: 0, y: 0, scale: 0.001 } });
  const wo = { isStatic: true, restitution: RESTITUTION, friction: FRICTION };
  Composite.add(engine.world, [
    Bodies.rectangle(W/2,    H+WALL/2,   W+WALL*2, WALL,     wo),
    Bodies.rectangle(W/2,   -WALL/2,     W+WALL*2, WALL,     wo),
    Bodies.rectangle(-WALL/2,   H/2,     WALL, H+WALL*2,     wo),
    Bodies.rectangle(W+WALL/2,  H/2,     WALL, H+WALL*2,     wo),
  ]);

  ball = Bodies.circle(W/2, H/2, RADIUS, {
    restitution: RESTITUTION, friction: FRICTION,
    frictionAir: FRICTION_AIR, density: 0.002,
  });
  Composite.add(engine.world, ball);

  runner = Runner.create();
  Runner.run(runner, engine);

  if (drawLoopId) cancelAnimationFrame(drawLoopId);
  drawLoop();
}

// ── Render loop ────────────────────────────────────────────────────────────
function drawLoop() {
  drawLoopId = requestAnimationFrame(drawLoop);
  tickFPS();

  // Apply gravity with correct orientation remapping
  const { gx, gy } = computeGravity(ax, ay);
  engine.gravity.x = gx;
  engine.gravity.y = gy;

  renderGL();

  // 2D canvas: corner brackets + trail
  const c = ctx2d;
  c.clearRect(0, 0, W, H);

  const br = 22;
  c.strokeStyle = 'rgba(0,255,120,0.11)';
  c.lineWidth = 1;
  [[0,0],[W,0],[0,H],[W,H]].forEach(([cx,cy]) => {
    const sx = cx===0?1:-1, sy = cy===0?1:-1;
    c.beginPath();
    c.moveTo(cx+sx*br, cy); c.lineTo(cx, cy); c.lineTo(cx, cy+sy*br);
    c.stroke();
  });

  if (ball) {
    const bx = ball.position.x, by = ball.position.y;
    const spd = Math.hypot(ball.velocity.x, ball.velocity.y);
    if (spd > 1.5) {
      const nx = -ball.velocity.x/spd, ny = -ball.velocity.y/spd;
      const tl = Math.min(spd * 3.5, 70);
      const tg = c.createLinearGradient(bx, by, bx+nx*tl, by+ny*tl);
      tg.addColorStop(0, 'rgba(180,220,255,0.15)');
      tg.addColorStop(1, 'rgba(180,220,255,0)');
      c.beginPath();
      c.moveTo(bx+nx*RADIUS*0.85, by+ny*RADIUS*0.85);
      c.lineTo(bx+nx*tl, by+ny*tl);
      c.lineWidth = RADIUS * 0.6; c.lineCap = 'round';
      c.strokeStyle = tg; c.stroke();
    }
  }

  updateDebug();
}

// ── Accelerometer ──────────────────────────────────────────────────────────
function startSensor() {
  function onMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a) return;
    ax = ax + ALPHA * ((a.x || 0) - ax);
    ay = ay + ALPHA * ((a.y || 0) - ay);
    az = az + ALPHA * ((a.z || 0) - az);
    sensorOk = true;
  }
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission()
      .then(s => { if (s==='granted') window.addEventListener('devicemotion', onMotion); })
      .catch(()=>{});
  } else if (typeof DeviceMotionEvent !== 'undefined') {
    window.addEventListener('devicemotion', onMotion);
  }
}

// ── Resize / orientation change ────────────────────────────────────────────
window.addEventListener('resize', () => { checkOrientation(); buildWorld(); });

// ── Start ──────────────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => {
  lockLandscape();
  hideBrowserUI();
  document.getElementById('permission-overlay').style.display = 'none';
  checkOrientation();
  buildWorld();
  startSensor();
});
</script>
</body>
</html>
