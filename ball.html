<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ball Physics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#0a0a0f; overflow:hidden; width:100%; height:100%; font-family:'Courier New',monospace; touch-action:none; }
  #debug {
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(0,255,120,0.07); border-bottom:1px solid rgba(0,255,120,0.18);
    padding:3px 8px; font-size:10px; color:#00ff78; letter-spacing:0.04em;
    display:flex; flex-wrap:wrap; align-items:center; backdrop-filter:blur(4px); line-height:1.65;
  }
  .dg { display:flex; align-items:center; gap:3px; margin-right:2px; }
  .dl { opacity:0.4; font-size:9px; } .dv { font-weight:bold; font-size:10px; min-width:34px; }
  .ds { opacity:0.18; margin:0 5px; }
  #fps-box { position:fixed; bottom:8px; right:10px; z-index:100; font-family:'Courier New',monospace; font-size:10px; color:#00ff78; opacity:0.55; pointer-events:none; }
  canvas { display:block; position:fixed; top:0; left:0; }
  #gl { z-index:1; } #c2d { z-index:2; }
  #overlay {
    position:fixed; inset:0; background:#0a0a0f; z-index:300;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:32px;
  }
  #overlay h1 { font-size:20px; color:#00ff78; letter-spacing:0.12em; text-align:center; }
  #overlay p  { font-size:13px; color:rgba(0,255,120,0.6); text-align:center; line-height:1.7; max-width:320px; }
  #btn-start {
    background:transparent; border:1.5px solid #00ff78; color:#00ff78;
    font-family:'Courier New',monospace; font-size:13px; letter-spacing:0.15em;
    padding:14px 36px; cursor:pointer; text-transform:uppercase;
    -webkit-tap-highlight-color:transparent;
  }
  #btn-start:active { background:#00ff78; color:#0a0a0f; }
</style>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="c2d"></canvas>
<div id="debug">cargando...</div>
<div id="fps-box">FPS —</div>

<div id="overlay">
  <h1>BALL PHYSICS</h1>
  <p id="odesc">Cargando...</p>
  <button id="btn-start">INICIAR</button>
</div>

<script>
'use strict';
const { Engine, Runner, Bodies, Body, Composite } = Matter;

// ── Device ─────────────────────────────────────────────────────────────────
const IS_DESKTOP = !('ontouchstart' in window) && !/Mobi|Android/i.test(navigator.userAgent);

// ── Constants ──────────────────────────────────────────────────────────────
const WALL         = 40;
const RADIUS_MAX   = 44;
const RADIUS_MIN   = 22;
const NUM_BALLS    = 20;
const RESTITUTION  = 0.88;
const FRICTION     = 0.0005;
const FRICTION_AIR = 0.003;
const SENSOR_ALPHA = 0.18;
const GAP_TOP_FRAC  = 0.28;   // top gap as fraction of W
const GAP_SIDE_FRAC = 0.22;   // side gap as fraction of H
const SPAWN_DELAY   = 350;    // ms between spawns

// ── Mutable state ──────────────────────────────────────────────────────────
let W, H;
let engine, runner;
let balls   = [];   // [{body, radius}]
let gaps    = null; // {topL,topR,leftT,leftB,rightT,rightB}
let ctx2d, glState;
let ax = 0, ay = 0, az = 0;
let sensorOk = false;
let fps = 0, _lastFpsTime = 0, _frameCount = 0;
let drawLoopId = null;
let spawnQueue = 0;
let lastSpawnMs = 0;
let lastEscapeMs = 0;

// ── Drag (desktop) ─────────────────────────────────────────────────────────
let drag = null;          // {entry}
let mX=0, mY=0, mVX=0, mVY=0;

// ── Debug helpers ──────────────────────────────────────────────────────────
const dbgEl  = document.getElementById('debug');
const fpsEl  = document.getElementById('fps-box');
function f1(n){ const s=(+n).toFixed(1); return s==='-0.0'?'0.0':s; }
function f2(n){ const s=(+n).toFixed(2); return s==='-0.00'?'0.00':s; }
function f0(n){ const s=(+n).toFixed(0); return s==='-0'?'0':s; }
function dg(l,v){ return `<span class="dg"><span class="dl">${l}</span><span class="dv">${v}</span></span>`; }
const SEP = '<span class="ds">|</span>';

function updateDebug(){
  const b = balls[0]?.body;
  dbgEl.innerHTML =
    dg('DEV', IS_DESKTOP?'PC':'MOB') + SEP +
    dg('SNS', sensorOk?'✓':'✗') + SEP +
    dg('AX',f1(ax))+SEP+dg('AY',f1(ay))+SEP+dg('AZ',f1(az))+SEP+
    dg('GX', engine?f2(engine.gravity.x):'--')+SEP+
    dg('GY', engine?f2(engine.gravity.y):'--')+SEP+
    dg('POS', b?`${f0(b.position.x)},${f0(b.position.y)}`:'--')+SEP+
    dg('SPD', b?f1(Math.hypot(b.velocity.x,b.velocity.y)):'--')+SEP+
    dg('N',   balls.length)+SEP+
    dg('Q',   spawnQueue);
  fpsEl.textContent = `FPS ${fps}`;
}

function tickFPS(){
  _frameCount++;
  const now = performance.now();
  if (now - _lastFpsTime >= 1000){ fps=_frameCount; _frameCount=0; _lastFpsTime=now; }
}

// ── Orientation / gravity ──────────────────────────────────────────────────
function orientAngle(){
  if (screen.orientation?.angle !== undefined) return ((screen.orientation.angle%360)+360)%360;
  return ((+(window.orientation||0))%360+360)%360;
}

function gravity(){
  if (IS_DESKTOP) return {gx:0, gy:1};
  const G = 9.8, a = orientAngle();
  if (a < 45 || a >= 315) return {gx:  ax/G, gy: -ay/G};
  if (a < 135)            return {gx:  ay/G, gy:  ax/G};
  if (a < 225)            return {gx: -ax/G, gy:  ay/G};
  /* 225-314 */           return {gx: -ay/G, gy: -ax/G};
}

// ── Browser helpers ────────────────────────────────────────────────────────
function goFullscreen(){
  const el = document.documentElement;
  (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el,{navigationUI:'hide'});
  setTimeout(()=>window.scrollTo(0,1), 100);
}
function lockLandscape(){
  const sc = screen;
  try{ sc.orientation?.lock('landscape'); }catch(e){}
  (sc.lockOrientation||sc.mozLockOrientation||sc.msLockOrientation||function(){}).call(sc,'landscape');
}

// ── Wall + gap construction ────────────────────────────────────────────────
function buildWalls(){
  const T = WALL;
  const wo = {isStatic:true, restitution:RESTITUTION, friction:FRICTION, label:'wall'};

  const gTW = W * GAP_TOP_FRAC;
  const gSH = H * GAP_SIDE_FRAC;
  gaps = {
    topL:  W/2 - gTW/2,   topR:  W/2 + gTW/2,
    leftT: H/2 - gSH/2,   leftB: H/2 + gSH/2,
    rightT:H/2 - gSH/2,   rightB:H/2 + gSH/2,
  };

  // Top: left segment [0 .. topL], right segment [topR .. W]
  const tLW = gaps.topL;
  const tRW = W - gaps.topR;
  // Sides: top segment [0..leftT], bottom [leftB..H]
  const sT = gaps.leftT;
  const sB = H - gaps.leftB;

  Composite.add(engine.world, [
    Bodies.rectangle(W/2,                  H + T/2,          W+T*2, T,   wo), // bottom solid
    Bodies.rectangle(tLW/2,                -T/2,             tLW,   T,   wo), // top-left
    Bodies.rectangle(gaps.topR + tRW/2,    -T/2,             tRW,   T,   wo), // top-right
    Bodies.rectangle(-T/2,                 sT/2,             T,     sT,  wo), // left-top
    Bodies.rectangle(-T/2,  gaps.leftB + sB/2,               T,     sB,  wo), // left-bottom
    Bodies.rectangle(W+T/2,                sT/2,             T,     sT,  wo), // right-top
    Bodies.rectangle(W+T/2, gaps.leftB + sB/2,               T,     sB,  wo), // right-bottom
  ]);
}

// ── Ball factory ────────────────────────────────────────────────────────────
function makeBall(bx, by, radius){
  const rn = (radius-RADIUS_MIN)/(RADIUS_MAX-RADIUS_MIN);
  const body = Bodies.circle(bx, by, radius, {
    restitution: RESTITUTION - rn*0.08,
    friction: FRICTION, frictionAir: FRICTION_AIR, density: 0.002,
  });
  Composite.add(engine.world, body);
  return {body, radius};
}

// ── Spawn queue ────────────────────────────────────────────────────────────
function gapClear(radius){
  const cx = (gaps.topL + gaps.topR) / 2;
  const clearY = radius * 4;
  for (const {body, radius:br} of balls){
    if (body.position.y < clearY &&
        Math.abs(body.position.x - cx) < (gaps.topR-gaps.topL)/2 + br)
      return false;
  }
  return true;
}

function trySpawn(){
  if (!gaps || spawnQueue <= 0) return;
  const now = performance.now();
  if (now - lastSpawnMs < SPAWN_DELAY) return;
  const radius = RADIUS_MIN + Math.random()*(RADIUS_MAX-RADIUS_MIN);
  if (!gapClear(radius)) return;
  const cx    = (gaps.topL + gaps.topR) / 2;
  const halfW = (gaps.topR - gaps.topL)/2 - radius - 2;
  const bx    = cx + (Math.random()-0.5)*2*Math.max(0, halfW);
  const entry = makeBall(bx, -radius-2, radius);
  Body.setVelocity(entry.body, {x:(Math.random()-0.5)*1.5, y:0.5});
  balls.push(entry);
  spawnQueue--;
  lastSpawnMs = now;
}

// ── Escape detection ────────────────────────────────────────────────────────
function checkEscapes(){
  const margin = RADIUS_MAX * 2;
  for (let i = balls.length-1; i >= 0; i--){
    const {x,y} = balls[i].body.position;
    if (x < -margin || x > W+margin || y < -margin){
      if (drag?.entry === balls[i]) drag = null;
      Composite.remove(engine.world, balls[i].body);
      balls.splice(i,1);
      spawnQueue++;
    }
  }
}

// ── WebGL ──────────────────────────────────────────────────────────────────
function initGL(){
  const canvas = document.getElementById('gl');
  canvas.width=W; canvas.height=H;
  const g = canvas.getContext('webgl',{alpha:false}) ||
            canvas.getContext('experimental-webgl',{alpha:false});
  if (!g){ console.warn('No WebGL'); return null; }

  const bgVS=`attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}`;
  const bgFS=`precision mediump float;varying vec2 vUv;uniform vec2 uRes;
    float grid(vec2 p){float s=34.,w=.65;vec2 g=mod(p,s);return max(smoothstep(w+1.,w,abs(g.y)),smoothstep(w+1.,w,abs(g.x)));}
    void main(){vec2 p=vUv*uRes;p.y=uRes.y-p.y;vec3 d=vec3(.04,.04,.072),l=vec3(.155,.195,.27);gl_FragColor=vec4(mix(d,l,grid(p)),1.);}`;

  const bVS=`attribute vec2 aPos;varying vec2 vPx;uniform vec2 uRes;
    void main(){vPx=(aPos*.5+.5)*uRes;vPx.y=uRes.y-vPx.y;gl_Position=vec4(aPos,0.,1.);}`;
  const bFS=`precision highp float;
    varying vec2 vPx;uniform vec2 uRes,uBall;uniform float uR,uDrag;
    float grid(vec2 p){float s=34.,w=.65;vec2 g=mod(p,s);return max(smoothstep(w+1.,w,abs(g.y)),smoothstep(w+1.,w,abs(g.x)));}
    vec3 bg(vec2 p){return mix(vec3(.04,.04,.072),vec3(.155,.195,.27),grid(p));}
    void main(){
      vec2 d=vPx-uBall;float dist=length(d),r=uR,hw=r*.4,or2=r+hw;
      if(dist>or2){gl_FragColor=vec4(0.);return;}
      if(dist>r){
        float t=(dist-r)/hw;
        float h=exp(-t*t*4.5)*(0.42+uDrag*.35);
        vec3 hc=mix(vec3(.5,.75,1.),vec3(1.,.85,.3),uDrag);
        gl_FragColor=vec4(hc*h,h);return;
      }
      float nd=dist/r,nz=sqrt(max(0.,1.-nd*nd));
      vec3 N=normalize(vec3(d/r,nz));
      float eta=1./1.55,ci=nz,s2t=eta*eta*(1.-ci*ci);
      vec2 off;
      if(s2t>1.){vec3 rf=vec3(0.,0.,-1.)-2.*dot(vec3(0.,0.,-1.),N)*N;off=rf.xy*r*1.5;}
      else{float ct=sqrt(1.-s2t);vec3 rv=eta*vec3(0.,0.,-1.)+(eta*ci-ct)*N;off=rv.xy*(-1.5*r/rv.z);}
      vec2 sp=clamp(uBall+off,vec2(0.),uRes);
      vec3 col=bg(vec2(sp.x,uRes.y-sp.y));
      col+=vec3(.7,.88,1.)*.05*(.3+.7*(1.-nz));
      vec2 s1=d-vec2(-r*.36,-r*.36);col+=exp(-dot(s1,s1)/(2.*(r*.19)*(r*.19)))*.20;
      vec2 s2=d+vec2(r*.2,r*.26);  col+=exp(-dot(s2,s2)/(2.*(r*.048)*(r*.048)))*.45;
      float e=smoothstep(1.,.9,nd);
      gl_FragColor=vec4(mix(bg(vPx),col,e),e);
    }`;

  function sh(type,src){
    const s=g.createShader(type);g.shaderSource(s,src);g.compileShader(s);
    if(!g.getShaderParameter(s,g.COMPILE_STATUS)){console.error('Shader:',g.getShaderInfoLog(s));return null;}
    return s;
  }
  function prog(vs,fs){
    const p=g.createProgram();
    g.attachShader(p,sh(g.VERTEX_SHADER,vs));
    g.attachShader(p,sh(g.FRAGMENT_SHADER,fs));
    g.linkProgram(p);
    if(!g.getProgramParameter(p,g.LINK_STATUS)){console.error('Program:',g.getProgramInfoLog(p));return null;}
    return p;
  }

  const bgP=prog(bgVS,bgFS), bP=prog(bVS,bFS);
  const fsqB=g.createBuffer();
  g.bindBuffer(g.ARRAY_BUFFER,fsqB);
  g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
  const bB=g.createBuffer();

  return {
    g, bgP, bP, fsqB, bB,
    bgA: g.getAttribLocation(bgP,'aPos'),
    bgR: g.getUniformLocation(bgP,'uRes'),
    bA:  g.getAttribLocation(bP,'aPos'),
    bR:  g.getUniformLocation(bP,'uRes'),
    bC:  g.getUniformLocation(bP,'uBall'),
    bRad:g.getUniformLocation(bP,'uR'),
    bDrg:g.getUniformLocation(bP,'uDrag'),
  };
}

function renderGL(){
  if (!glState) return;
  const {g,bgP,bP,fsqB,bB,bgA,bgR,bA,bR,bC,bRad,bDrg}=glState;
  g.viewport(0,0,W,H);

  // Pass A: background
  g.disable(g.BLEND);
  g.useProgram(bgP);
  g.bindBuffer(g.ARRAY_BUFFER,fsqB);
  g.enableVertexAttribArray(bgA); g.vertexAttribPointer(bgA,2,g.FLOAT,false,0,0);
  g.uniform2f(bgR,W,H);
  g.drawArrays(g.TRIANGLE_STRIP,0,4);

  // Pass B: each ball (sorted largest first)
  g.enable(g.BLEND); g.blendFunc(g.SRC_ALPHA,g.ONE_MINUS_SRC_ALPHA);
  g.useProgram(bP); g.uniform2f(bR,W,H);
  const sorted=[...balls].sort((a,b)=>b.radius-a.radius);
  for (const entry of sorted){
    const {body:{position:{x:cx,y:cy}},radius}=entry;
    const e=radius*1.45;
    const verts=new Float32Array([
      (cx-e)/W*2-1, 1-(cy+e)/H*2,
      (cx+e)/W*2-1, 1-(cy+e)/H*2,
      (cx-e)/W*2-1, 1-(cy-e)/H*2,
      (cx+e)/W*2-1, 1-(cy-e)/H*2,
    ]);
    g.bindBuffer(g.ARRAY_BUFFER,bB); g.bufferData(g.ARRAY_BUFFER,verts,g.DYNAMIC_DRAW);
    g.enableVertexAttribArray(bA); g.vertexAttribPointer(bA,2,g.FLOAT,false,0,0);
    g.uniform2f(bC,cx,cy); g.uniform1f(bRad,radius);
    g.uniform1f(bDrg, drag?.entry===entry ? 1.0 : 0.0);
    g.drawArrays(g.TRIANGLE_STRIP,0,4);
  }
}

// ── 2D gap visuals ──────────────────────────────────────────────────────────
function drawGaps(c){
  if (!gaps) return;
  const pulse = 0.55 + 0.45*Math.sin(performance.now()*0.003);
  const a = 0.28 + 0.30*pulse;
  c.strokeStyle = `rgba(0,255,120,${a})`;
  c.fillStyle   = `rgba(0,255,120,${a})`;
  c.lineWidth   = 2;

  function bracket(x0,y0,x1,y1){ c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke(); }
  function arrow(ox,oy,dx,dy,len){
    const ex=ox+dx*len,ey=oy+dy*len;
    c.beginPath();c.moveTo(ox,oy);c.lineTo(ex,ey);c.stroke();
    const px=-dy,py=dx,hw=5,hl=8;
    c.beginPath();c.moveTo(ex,ey);
    c.lineTo(ex-dx*hl+px*hw,ey-dy*hl+py*hw);
    c.lineTo(ex-dx*hl-px*hw,ey-dy*hl-py*hw);
    c.closePath();c.fill();
  }

  // Top gap
  const tCX=(gaps.topL+gaps.topR)/2;
  bracket(gaps.topL,0,gaps.topL,10); bracket(gaps.topR,0,gaps.topR,10);
  bracket(gaps.topL,0,gaps.topR,0);
  arrow(tCX,0,0,1,16);
  c.globalAlpha=a*0.9; c.font='9px Courier New'; c.textAlign='center';
  c.fillText('SPAWN',tCX,22); c.textAlign='left'; c.globalAlpha=1;

  // Left gap
  const lCY=(gaps.leftT+gaps.leftB)/2;
  bracket(0,gaps.leftT,10,gaps.leftT); bracket(0,gaps.leftB,10,gaps.leftB);
  bracket(0,gaps.leftT,0,gaps.leftB);
  arrow(0,lCY,1,0,16);

  // Right gap
  const rCY=(gaps.rightT+gaps.rightB)/2;
  bracket(W,gaps.rightT,W-10,gaps.rightT); bracket(W,gaps.rightB,W-10,gaps.rightB);
  bracket(W,gaps.rightT,W,gaps.rightB);
  arrow(W,rCY,-1,0,16);
}

// ── Main loop ───────────────────────────────────────────────────────────────
function drawLoop(){
  drawLoopId = requestAnimationFrame(drawLoop);
  tickFPS();

  // Apply gravity
  const {gx,gy}=gravity();
  engine.gravity.x=gx; engine.gravity.y=gy;

  // Drag
  if (drag){
    Body.setVelocity(drag.entry.body,{x:mVX*.6,y:mVY*.6});
    Body.setPosition(drag.entry.body,{
      x: drag.entry.body.position.x+(mX-drag.entry.body.position.x)*.35,
      y: drag.entry.body.position.y+(mY-drag.entry.body.position.y)*.35,
    });
  }

  // Escape + spawn
  const now=performance.now();
  if (now-lastEscapeMs > 150){ checkEscapes(); lastEscapeMs=now; }
  trySpawn();

  // Render
  renderGL();
  const c=ctx2d;
  c.clearRect(0,0,W,H);
  drawGaps(c);

  // Corner brackets
  c.strokeStyle='rgba(0,255,120,0.11)'; c.lineWidth=1;
  [[0,0],[W,0],[0,H],[W,H]].forEach(([cx,cy])=>{
    const sx=cx?-1:1,sy=cy?-1:1;
    c.beginPath();c.moveTo(cx+sx*22,cy);c.lineTo(cx,cy);c.lineTo(cx,cy+sy*22);c.stroke();
  });

  // Trails
  for (const {body,radius} of balls){
    const spd=Math.hypot(body.velocity.x,body.velocity.y);
    if (spd>1.5){
      const nx=-body.velocity.x/spd,ny=-body.velocity.y/spd,tl=Math.min(spd*3.5,70);
      const tg=c.createLinearGradient(body.position.x,body.position.y,body.position.x+nx*tl,body.position.y+ny*tl);
      tg.addColorStop(0,'rgba(180,220,255,0.15)'); tg.addColorStop(1,'rgba(180,220,255,0)');
      c.beginPath();c.moveTo(body.position.x+nx*radius*.85,body.position.y+ny*radius*.85);
      c.lineTo(body.position.x+nx*tl,body.position.y+ny*tl);
      c.lineWidth=radius*.6;c.lineCap='round';c.strokeStyle=tg;c.stroke();
    }
  }

  updateDebug();
}

// ── Build world ─────────────────────────────────────────────────────────────
function buildWorld(){
  if (runner){ Runner.stop(runner); runner=null; }
  if (drawLoopId){ cancelAnimationFrame(drawLoopId); drawLoopId=null; }
  drag=null; balls=[];

  W=window.innerWidth; H=window.innerHeight;

  document.getElementById('c2d').width=W;
  document.getElementById('c2d').height=H;
  ctx2d=document.getElementById('c2d').getContext('2d');

  document.getElementById('gl').width=W;
  document.getElementById('gl').height=H;
  glState=initGL();

  engine=Engine.create({gravity:{x:0,y:0,scale:0.001}});
  engine.positionIterations=10;
  engine.velocityIterations=8;
  engine.constraintIterations=4;

  buildWalls();

  // Queue NUM_BALLS to spawn through the top gap
  spawnQueue=NUM_BALLS;
  lastSpawnMs=0;
  lastEscapeMs=0;

  runner=Runner.create();
  Runner.run(runner,engine);
  drawLoop();
}

// ── Desktop mouse drag ──────────────────────────────────────────────────────
function setupDrag(){
  const el=document.getElementById('c2d');
  function pos(e){ const r=el.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  el.addEventListener('mousedown',e=>{
    const {x,y}=pos(e); mX=x;mY=y;
    for (const entry of [...balls].sort((a,b)=>a.radius-b.radius)){
      if (Math.hypot(entry.body.position.x-x,entry.body.position.y-y)<=entry.radius){
        drag={entry}; Body.setStatic(entry.body,true); e.preventDefault(); break;
      }
    }
  });
  el.addEventListener('mousemove',e=>{
    const {x,y}=pos(e); mVX=x-mX;mVY=y-mY; mX=x;mY=y;
  });
  function end(){ if(drag){ Body.setStatic(drag.entry.body,false); Body.setVelocity(drag.entry.body,{x:mVX*1.2,y:mVY*1.2}); drag=null; } }
  el.addEventListener('mouseup',end); el.addEventListener('mouseleave',end);
}

// ── Sensor ──────────────────────────────────────────────────────────────────
function startSensor(){
  if (IS_DESKTOP){ sensorOk=true; return; }
  function onM(e){
    const a=e.accelerationIncludingGravity; if(!a) return;
    ax+=SENSOR_ALPHA*((a.x||0)-ax);
    ay+=SENSOR_ALPHA*((a.y||0)-ay);
    az+=SENSOR_ALPHA*((a.z||0)-az);
    sensorOk=true;
  }
  if (typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission().then(s=>{ if(s==='granted') window.addEventListener('devicemotion',onM); }).catch(()=>{});
  } else if (typeof DeviceMotionEvent!=='undefined'){
    window.addEventListener('devicemotion',onM);
  }
}

// ── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', ()=>{ if(gameStarted) buildWorld(); });

// ── Init overlay ─────────────────────────────────────────────────────────────
let gameStarted=false;
document.getElementById('odesc').textContent = IS_DESKTOP
  ? 'Gravedad fija hacia abajo. Arrastra bolas con el ratón. Las bolas escapan por las aperturas.'
  : 'Inclina el móvil para mover las bolas. Las bolas escapan por las aperturas.';

document.getElementById('btn-start').addEventListener('click', ()=>{
  gameStarted=true;
  document.getElementById('overlay').style.display='none';
  if (!IS_DESKTOP){ lockLandscape(); goFullscreen(); }
  buildWorld();
  startSensor();
  if (IS_DESKTOP) setupDrag();
});
</script>
