<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ball Physics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #0a0a0f;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }

  /* ── Forzar apaisado via CSS cuando el navegador no soporte Screen Orientation API ── */
  @media screen and (orientation: portrait) {
    #rotate-msg {
      display: flex !important;
    }
  }

  #rotate-msg {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    z-index: 999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    color: #00ff78;
    font-family: 'Courier New', monospace;
    text-align: center;
    padding: 32px;
  }
  #rotate-msg svg { animation: spin 2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #rotate-msg p { font-size: 14px; opacity: 0.7; letter-spacing: 0.1em; }

  #debug {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(0, 255, 120, 0.07);
    border-bottom: 1px solid rgba(0, 255, 120, 0.2);
    padding: 3px 8px;
    font-size: 10px;
    color: #00ff78;
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0;
    backdrop-filter: blur(4px);
    line-height: 1.5;
  }

  .dbg-group {
    display: flex;
    align-items: center;
    gap: 3px;
    flex: 1;
    justify-content: center;
  }
  .dbg-group:first-child { justify-content: flex-start; }
  .dbg-group:last-child  { justify-content: flex-end; }

  .dbg-label { opacity: 0.45; font-size: 9px; text-transform: uppercase; }
  .dbg-val   { opacity: 1; font-weight: bold; font-size: 10px; min-width: 38px; text-align: right; }
  .dbg-sep   { opacity: 0.2; margin: 0 4px; }

  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
  }

  #permission-overlay {
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 200;
    padding: 32px;
  }

  #permission-overlay h1 {
    font-size: 20px;
    color: #00ff78;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.12em;
    text-align: center;
  }

  #permission-overlay p {
    font-size: 13px;
    color: rgba(0,255,120,0.6);
    font-family: 'Courier New', monospace;
    text-align: center;
    line-height: 1.7;
    max-width: 320px;
  }

  #btn-start {
    background: transparent;
    border: 1.5px solid #00ff78;
    color: #00ff78;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    padding: 14px 36px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  #btn-start:active { background: #00ff78; color: #0a0a0f; }
</style>
</head>
<body>

<!-- Mensaje de rotación manual (fallback si Screen Orientation API falla) -->
<div id="rotate-msg">
  <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="6" width="28" height="36" rx="4" stroke="#00ff78" stroke-width="2"/>
    <path d="M32 2 L38 8 L32 14" stroke="#00ff78" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="38" y1="8" x2="24" y2="8" stroke="#00ff78" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <p>GIRA EL MÓVIL<br>A MODO APAISADO</p>
</div>

<div id="permission-overlay">
  <h1>BALL PHYSICS</h1>
  <p>Inclina el móvil para controlar la bola con física real basada en el acelerómetro.</p>
  <button id="btn-start">INICIAR</button>
</div>

<div id="debug">cargando...</div>
<canvas id="c"></canvas>

<script>
const { Engine, Runner, Bodies, Body, Composite } = Matter;

// ── Constants ──────────────────────────────────────────────────────────────
const WALL        = 40;
const RADIUS      = 22;
const RESTITUTION = 0.72;
const FRICTION    = 0.001;
const FRICTION_AIR = 0.012;
const ALPHA       = 0.18;   // low-pass filter

// ── State ──────────────────────────────────────────────────────────────────
let W, H;
let engine, runner, ball, ctx;
let ax = 0, ay = 0, az = 0;
let sensorOk = false;
let fps = 0, lastTime = performance.now(), frameCount = 0;
let drawLoopId = null;

// ── Debug bar (distribuida a lo ancho) ────────────────────────────────────
const dbg = document.getElementById('debug');

function v(label, val) {
  return `<span class="dbg-group"><span class="dbg-label">${label}</span><span class="dbg-val">${val}</span></span>`;
}
function sep() { return '<span class="dbg-sep">|</span>'; }

function updateDebug() {
  const bx  = ball ? ball.position.x.toFixed(0) : '--';
  const by  = ball ? ball.position.y.toFixed(0) : '--';
  const vx  = ball ? ball.velocity.x.toFixed(1) : '--';
  const vy  = ball ? ball.velocity.y.toFixed(1) : '--';
  const spd = ball ? Math.hypot(ball.velocity.x, ball.velocity.y).toFixed(1) : '--';
  const gx  = engine ? engine.gravity.x.toFixed(2) : '--';
  const gy  = engine ? engine.gravity.y.toFixed(2) : '--';

  dbg.innerHTML =
    v('SENSOR', sensorOk ? '✓ OK' : '✗ OFF') + sep() +
    v('AX', ax.toFixed(1)) + sep() +
    v('AY', ay.toFixed(1)) + sep() +
    v('AZ', az.toFixed(1)) + sep() +
    v('GX', gx) + sep() + v('GY', gy) + sep() +
    v('POS', `${bx},${by}`) + sep() +
    v('VEL', `${vx},${vy}`) + sep() +
    v('SPD', spd) + sep() +
    v('FPS', fps);
}

// ── FPS ────────────────────────────────────────────────────────────────────
function tickFPS() {
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastTime = now;
  }
}

// ── Build / rebuild world ──────────────────────────────────────────────────
function buildWorld() {
  if (runner) Runner.stop(runner);
  if (engine) Composite.clear(engine.world, false);

  W = window.innerWidth;
  H = window.innerHeight;

  const canvas  = document.getElementById('c');
  canvas.width  = W;
  canvas.height = H;
  ctx = canvas.getContext('2d');

  engine = Engine.create({ gravity: { x: 0, y: 0, scale: 0.001 } });

  const wo = { isStatic: true, restitution: RESTITUTION, friction: FRICTION };
  const walls = [
    Bodies.rectangle(W/2,  H + WALL/2, W + WALL*2, WALL,       wo), // bottom
    Bodies.rectangle(W/2,  -WALL/2,    W + WALL*2, WALL,       wo), // top
    Bodies.rectangle(-WALL/2,   H/2,   WALL, H + WALL*2,       wo), // left
    Bodies.rectangle(W + WALL/2, H/2,  WALL, H + WALL*2,       wo), // right
  ];

  const DBG_H = dbg.offsetHeight || 22;
  ball = Bodies.circle(W/2, H/2 + DBG_H/2, RADIUS, {
    restitution: RESTITUTION,
    friction: FRICTION,
    frictionAir: FRICTION_AIR,
    density: 0.002,
  });

  Composite.add(engine.world, [...walls, ball]);

  runner = Runner.create();
  Runner.run(runner, engine);

  if (drawLoopId) cancelAnimationFrame(drawLoopId);
  drawLoop();
}

// ── Main render loop ───────────────────────────────────────────────────────
function drawLoop() {
  tickFPS();

  // ── Gravity mapping (landscape mode, home button right = standard) ──────
  // In landscape-right (home right):
  //   device X axis → screen Y  (tilt top/bottom)
  //   device Y axis → screen X  (tilt left/right)
  //   az tells us if face-up or face-down
  //
  // accelerationIncludingGravity in landscape-right:
  //   a.x: tilting top-toward-user → positive = gravity pulls "up" on screen
  //   a.y: tilting right-toward-user → positive = gravity pulls "right" on screen
  //
  // We want: tilt right → ball goes right (gx positive)
  //          tilt top-up → ball goes up (gy negative)
  //
  // Empirically on most browsers in landscape:
  //   gx = -ay / 9.8   (ay positive when right side down → gx positive = go right ✓ but inverted, so negate)
  //   gy =  ax / 9.8   (ax positive when top toward user → gy positive = go down, but we want tilt-top → go up)
  //
  // The user reported physics were INVERTED, so we flip both signs:
  const G = 9.8;
  engine.gravity.x =  ay / G;   // was -ay, now +ay (fixed inversion)
  engine.gravity.y = -ax / G;   // was +ax, now -ax (fixed inversion)

  // ── Draw ──────────────────────────────────────────────────────────────────
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  // Corner brackets
  const br = 22;
  ctx.strokeStyle = 'rgba(0,255,120,0.13)';
  ctx.lineWidth = 1;
  [[0,0],[W,0],[0,H],[W,H]].forEach(([cx,cy]) => {
    const sx = cx === 0 ? 1 : -1, sy = cy === 0 ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(cx + sx*br, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + sy*br);
    ctx.stroke();
  });

  const bx = ball.position.x, by = ball.position.y;

  // Glow
  const glow = ctx.createRadialGradient(bx, by, 0, bx, by, RADIUS * 2.6);
  glow.addColorStop(0, 'rgba(0,255,120,0.17)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.arc(bx, by, RADIUS*2.6, 0, Math.PI*2);
  ctx.fillStyle = glow; ctx.fill();

  // Trail
  const spd = Math.hypot(ball.velocity.x, ball.velocity.y);
  if (spd > 1.5) {
    const nx = -ball.velocity.x/spd, ny = -ball.velocity.y/spd;
    const tl = Math.min(spd * 3.5, 70);
    const tg = ctx.createLinearGradient(bx, by, bx+nx*tl, by+ny*tl);
    tg.addColorStop(0, 'rgba(0,255,120,0.32)');
    tg.addColorStop(1, 'rgba(0,255,120,0)');
    ctx.beginPath();
    ctx.moveTo(bx+nx*RADIUS*0.8, by+ny*RADIUS*0.8);
    ctx.lineTo(bx+nx*tl, by+ny*tl);
    ctx.lineWidth = RADIUS * 0.85; ctx.lineCap = 'round';
    ctx.strokeStyle = tg; ctx.stroke();
  }

  // Ball
  const bg = ctx.createRadialGradient(bx-RADIUS*0.3, by-RADIUS*0.3, 1, bx, by, RADIUS);
  bg.addColorStop(0, '#afffdb'); bg.addColorStop(0.45, '#00ff78'); bg.addColorStop(1, '#005828');
  ctx.beginPath(); ctx.arc(bx, by, RADIUS, 0, Math.PI*2);
  ctx.fillStyle = bg; ctx.fill();

  // Specular
  ctx.beginPath(); ctx.arc(bx-RADIUS*0.28, by-RADIUS*0.28, RADIUS*0.22, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();

  updateDebug();
  drawLoopId = requestAnimationFrame(drawLoop);
}

// ── Screen Orientation: forzar landscape ──────────────────────────────────
function lockLandscape() {
  // Modern API
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
  // Older webkit
  if (screen.lockOrientation) screen.lockOrientation('landscape');
  if (screen.mozLockOrientation) screen.mozLockOrientation('landscape');
  if (screen.msLockOrientation) screen.msLockOrientation('landscape');
}

// ── Accelerometer ──────────────────────────────────────────────────────────
function startSensor() {
  function onMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a) return;
    ax = ax + ALPHA * ((a.x || 0) - ax);
    ay = ay + ALPHA * ((a.y || 0) - ay);
    az = az + ALPHA * ((a.z || 0) - az);
    sensorOk = true;
  }

  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    // iOS 13+
    DeviceMotionEvent.requestPermission()
      .then(s => {
        if (s === 'granted') window.addEventListener('devicemotion', onMotion);
        else fallbackPointer();
      }).catch(fallbackPointer);
  } else if (typeof DeviceMotionEvent !== 'undefined') {
    window.addEventListener('devicemotion', onMotion);
    setTimeout(() => { if (!sensorOk) fallbackPointer(); }, 1200);
  } else {
    fallbackPointer();
  }
}

// ── Fallback pointer ───────────────────────────────────────────────────────
function fallbackPointer() {
  sensorOk = false;
  function onPtr(e) {
    const cx = e.clientX ?? e.touches?.[0]?.clientX ?? W/2;
    const cy = e.clientY ?? e.touches?.[0]?.clientY ?? H/2;
    // Map center→0, edge→±9.8; mirror to match corrected gravity signs
    ay =  ((cx / W) - 0.5) * 2 * 9.8;
    ax = -((cy / H) - 0.5) * 2 * 9.8;
    sensorOk = true;
  }
  window.addEventListener('mousemove', onPtr);
  window.addEventListener('touchmove', onPtr, { passive: true });
}

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', buildWorld);

// ── Start ─────────────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => {
  lockLandscape();
  document.getElementById('permission-overlay').style.display = 'none';
  buildWorld();
  startSensor();
});
</script>
</body>
</html>
