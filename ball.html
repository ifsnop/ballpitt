<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ball Physics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    overflow: hidden;
    width: 100vw;
    height: 100dvh;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }

  #debug {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(0, 255, 120, 0.08);
    border-bottom: 1px solid rgba(0, 255, 120, 0.25);
    padding: 4px 8px;
    font-size: 10px;
    color: #00ff78;
    letter-spacing: 0.03em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.6;
    backdrop-filter: blur(4px);
  }

  #debug span { opacity: 0.6; margin-right: 2px; }
  #debug b { opacity: 1; margin-right: 12px; }

  canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
  }

  #permission-overlay {
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 200;
    padding: 32px;
  }

  #permission-overlay h1 {
    font-size: 22px;
    color: #00ff78;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.1em;
    text-align: center;
  }

  #permission-overlay p {
    font-size: 14px;
    color: rgba(0,255,120,0.6);
    font-family: 'Courier New', monospace;
    text-align: center;
    line-height: 1.7;
    max-width: 280px;
  }

  #btn-start {
    background: transparent;
    border: 1.5px solid #00ff78;
    color: #00ff78;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    padding: 14px 36px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  #btn-start:active {
    background: #00ff78;
    color: #0a0a0f;
  }
</style>
</head>
<body>

<div id="permission-overlay">
  <h1>BALL PHYSICS</h1>
  <p>Inclina el móvil para controlar la bola con física real basada en el acelerómetro.</p>
  <button id="btn-start">INICIAR</button>
</div>

<div id="debug">cargando...</div>
<canvas id="c"></canvas>

<script>
// ── Matter.js aliases ──────────────────────────────────────────────────────
const { Engine, Render, Runner, Bodies, Body, Composite,
        Events, Vector }  = Matter;

// ── Constants ──────────────────────────────────────────────────────────────
const WALL     = 40;       // thickness of boundary walls
const RADIUS   = 22;       // ball radius
const G_SCALE  = 9.8;      // gravity multiplier (maps accel m/s² to pixels/frame²)
const RESTITUTION = 0.72;  // bounciness
const FRICTION    = 0.001;
const FRICTION_AIR = 0.012;

// ── State ──────────────────────────────────────────────────────────────────
let W, H;
let engine, runner, ball;
let ax = 0, ay = 0, az = 0;   // raw accelerometer values (m/s²)
let sensorOk = false;
let fps = 0, lastTime = performance.now(), frameCount = 0;

// ── Debug bar ──────────────────────────────────────────────────────────────
const dbg = document.getElementById('debug');
function updateDebug() {
  const bx  = ball ? ball.position.x.toFixed(1) : '-';
  const by  = ball ? ball.position.y.toFixed(1) : '-';
  const vx  = ball ? ball.velocity.x.toFixed(2) : '-';
  const vy  = ball ? ball.velocity.y.toFixed(2) : '-';
  const spd = ball ? Math.hypot(ball.velocity.x, ball.velocity.y).toFixed(2) : '-';

  dbg.innerHTML =
    `<span>SENSOR</span><b>${sensorOk ? '✓ OK' : '✗ OFF'}</b>` +
    `<span>AX</span><b>${ax.toFixed(2)}</b>` +
    `<span>AY</span><b>${ay.toFixed(2)}</b>` +
    `<span>AZ</span><b>${az.toFixed(2)}</b>` +
    `<span>POS</span><b>${bx},${by}</b>` +
    `<span>VEL</span><b>${vx},${vy}</b>` +
    `<span>SPD</span><b>${spd}</b>` +
    `<span>FPS</span><b>${fps}</b>`;
}

// ── FPS counter ────────────────────────────────────────────────────────────
function tickFPS() {
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastTime = now;
  }
}

// ── Build world ────────────────────────────────────────────────────────────
function buildWorld() {
  W = window.innerWidth;
  H = window.innerHeight;

  // Canvas
  const canvas = document.getElementById('c');
  canvas.width  = W;
  canvas.height = H;

  // Engine
  engine = Engine.create({
    gravity: { x: 0, y: 1, scale: 0.001 }
  });

  // Custom renderer using Canvas 2D (lighter than Matter's WebGL)
  const ctx = canvas.getContext('2d');

  // Walls: bottom, top, left, right
  const wallOpts = { isStatic: true, restitution: RESTITUTION, friction: FRICTION, label: 'wall' };
  const walls = [
    Bodies.rectangle(W/2, H + WALL/2,     W + WALL*2, WALL,     wallOpts), // bottom
    Bodies.rectangle(W/2, -WALL/2,         W + WALL*2, WALL,     wallOpts), // top
    Bodies.rectangle(-WALL/2, H/2,         WALL,       H + WALL*2, wallOpts), // left
    Bodies.rectangle(W + WALL/2, H/2,      WALL,       H + WALL*2, wallOpts), // right
  ];

  // Ball
  ball = Bodies.circle(W/2, H/2, RADIUS, {
    restitution: RESTITUTION,
    friction: FRICTION,
    frictionAir: FRICTION_AIR,
    density: 0.002,
    label: 'ball'
  });

  Composite.add(engine.world, [...walls, ball]);

  // Runner
  runner = Runner.create();
  Runner.run(runner, engine);

  // Render loop
  function draw() {
    tickFPS();

    // Apply accelerometer → gravity
    // Device: ax positive = tilt right, ay positive = tilt toward user (face up)
    // In portrait: ax maps to world X, ay maps to world Y (but sign depends on orientation)
    const gx =  ax / G_SCALE;   // normalized -1..1
    const gy = -ay / G_SCALE;   // flip: tilt top away = ball falls down

    engine.gravity.x = gx;
    engine.gravity.y = gy;

    // Draw
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    // Corner decorations
    const corner = 20;
    ctx.strokeStyle = 'rgba(0,255,120,0.15)';
    ctx.lineWidth = 1;
    [[0,0],[W,0],[0,H],[W,H]].forEach(([cx,cy]) => {
      const sx = cx === 0 ? 1 : -1;
      const sy = cy === 0 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(cx + sx * corner, cy);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx, cy + sy * corner);
      ctx.stroke();
    });

    // Ball shadow
    const bx = ball.position.x;
    const by = ball.position.y;

    const shadowGrad = ctx.createRadialGradient(bx + 4, by + 4, 0, bx + 4, by + 4, RADIUS * 1.8);
    shadowGrad.addColorStop(0, 'rgba(0,255,120,0.12)');
    shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(bx + 4, by + 4, RADIUS * 1.8, 0, Math.PI * 2);
    ctx.fillStyle = shadowGrad;
    ctx.fill();

    // Ball glow
    const glowGrad = ctx.createRadialGradient(bx, by, 0, bx, by, RADIUS * 2.5);
    glowGrad.addColorStop(0, 'rgba(0,255,120,0.18)');
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(bx, by, RADIUS * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();

    // Ball body
    const ballGrad = ctx.createRadialGradient(bx - RADIUS*0.3, by - RADIUS*0.3, 1, bx, by, RADIUS);
    ballGrad.addColorStop(0, '#afffdb');
    ballGrad.addColorStop(0.45, '#00ff78');
    ballGrad.addColorStop(1, '#006630');
    ctx.beginPath();
    ctx.arc(bx, by, RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = ballGrad;
    ctx.fill();

    // Ball specular
    ctx.beginPath();
    ctx.arc(bx - RADIUS*0.28, by - RADIUS*0.28, RADIUS*0.22, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fill();

    // Velocity trail
    const spd = Math.hypot(ball.velocity.x, ball.velocity.y);
    if (spd > 1.5) {
      const nx = -ball.velocity.x / spd;
      const ny = -ball.velocity.y / spd;
      const trailLen = Math.min(spd * 3.5, 60);
      const trailGrad = ctx.createLinearGradient(bx, by, bx + nx*trailLen, by + ny*trailLen);
      trailGrad.addColorStop(0, 'rgba(0,255,120,0.35)');
      trailGrad.addColorStop(1, 'rgba(0,255,120,0)');
      ctx.beginPath();
      ctx.moveTo(bx + nx*RADIUS*0.8, by + ny*RADIUS*0.8);
      ctx.lineTo(bx + nx*trailLen, by + ny*trailLen);
      ctx.lineWidth = RADIUS * 0.9;
      ctx.lineCap = 'round';
      ctx.strokeStyle = trailGrad;
      ctx.stroke();
    }

    updateDebug();
    requestAnimationFrame(draw);
  }

  draw();
}

// ── Accelerometer ──────────────────────────────────────────────────────────
function startSensor() {
  const ALPHA = 0.15; // low-pass filter coefficient

  function onMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a) return;
    // Low-pass filter to reduce jitter
    ax = ax + ALPHA * ((a.x || 0) - ax);
    ay = ay + ALPHA * ((a.y || 0) - ay);
    az = az + ALPHA * ((a.z || 0) - az);
    sensorOk = true;
  }

  // iOS 13+ requires permission
  if (typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function') {
    DeviceMotionEvent.requestPermission()
      .then(state => {
        if (state === 'granted') window.addEventListener('devicemotion', onMotion);
        else fallbackMouseGravity();
      })
      .catch(() => fallbackMouseGravity());
  } else if (typeof DeviceMotionEvent !== 'undefined') {
    window.addEventListener('devicemotion', onMotion);
    // Mark sensor ok after first event or 1s timeout
    setTimeout(() => { if (!sensorOk) fallbackMouseGravity(); }, 1000);
  } else {
    fallbackMouseGravity();
  }
}

// ── Fallback: mouse/touch tilt simulation ─────────────────────────────────
function fallbackMouseGravity() {
  sensorOk = false;
  dbg.title = 'Sin acelerómetro – usa el ratón/touch para simular';

  // Map pointer position → gravity
  function onPointer(e) {
    const cx = (e.clientX || (e.touches && e.touches[0].clientX) || W/2);
    const cy = (e.clientY || (e.touches && e.touches[0].clientY) || H/2);
    // Center = 0 gravity, edges = ±9.8
    ax = ((cx / W) - 0.5) * 2 * 9.8;
    ay = -((cy / H) - 0.5) * 2 * 9.8;
    sensorOk = true;
  }

  window.addEventListener('mousemove', onPointer);
  window.addEventListener('touchmove', onPointer, { passive: true });
}

// ── Handle resize ──────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  // Rebuild world on orientation change
  if (engine) {
    Composite.clear(engine.world);
    Runner.stop(runner);
  }
  buildWorld();
});

// ── Start button ───────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => {
  document.getElementById('permission-overlay').style.display = 'none';
  buildWorld();
  startSensor();
});
</script>
</body>
</html>
