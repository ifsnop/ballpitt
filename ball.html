<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ball Physics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0a0a0f; overflow: hidden;
    width: 100%; height: 100%;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }
  #rotate-msg {
    display: none; position: fixed; inset: 0;
    background: #0a0a0f; z-index: 999;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; color: #00ff78; text-align: center; padding: 32px;
  }
  #rotate-msg.show { display: flex; }
  #rotate-msg svg  { animation: spin 2s linear infinite; }
  @keyframes spin  { to { transform: rotate(360deg); } }
  #rotate-msg p    { font-size: 14px; opacity: 0.7; letter-spacing: 0.1em; }

  #debug {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(0,255,120,0.07);
    border-bottom: 1px solid rgba(0,255,120,0.18);
    padding: 3px 8px; font-size: 10px; color: #00ff78;
    letter-spacing: 0.04em;
    display: flex; flex-wrap: wrap; align-items: center;
    backdrop-filter: blur(4px); line-height: 1.65;
  }
  .dg { display: flex; align-items: center; gap: 3px; margin-right: 2px; }
  .dl { opacity: 0.4; font-size: 9px; }
  .dv { font-weight: bold; font-size: 10px; min-width: 34px; }
  .ds { opacity: 0.18; margin: 0 5px; }

  #fps-box {
    position: fixed; bottom: 8px; right: 10px; z-index: 100;
    font-family: 'Courier New', monospace;
    font-size: 10px; color: #00ff78; opacity: 0.55;
    letter-spacing: 0.05em; pointer-events: none;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  #gl  { z-index: 1; }
  #c2d { z-index: 2; }

  #permission-overlay {
    position: fixed; inset: 0; background: #0a0a0f;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px; z-index: 300; padding: 32px;
  }
  #permission-overlay h1 { font-size: 20px; color: #00ff78; letter-spacing: 0.12em; text-align: center; }
  #permission-overlay p  { font-size: 13px; color: rgba(0,255,120,0.6); text-align: center; line-height: 1.7; max-width: 320px; }
  #btn-start {
    background: transparent; border: 1.5px solid #00ff78; color: #00ff78;
    font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 0.15em;
    padding: 14px 36px; cursor: pointer; text-transform: uppercase;
    transition: background .2s, color .2s; -webkit-tap-highlight-color: transparent;
  }
  #btn-start:active { background: #00ff78; color: #0a0a0f; }
</style>
</head>
<body>

<div id="rotate-msg">
  <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
    <rect x="10" y="6" width="28" height="36" rx="4" stroke="#00ff78" stroke-width="2"/>
    <path d="M32 2 L38 8 L32 14" stroke="#00ff78" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="38" y1="8" x2="24" y2="8" stroke="#00ff78" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <p>GIRA EL MÓVIL<br>A MODO APAISADO</p>
</div>

<div id="permission-overlay">
  <h1>BALL PHYSICS</h1>
  <p>Inclina el móvil para controlar la bola con física real basada en el acelerómetro.</p>
  <button id="btn-start">INICIAR</button>
</div>

<canvas id="gl"></canvas>
<canvas id="c2d"></canvas>
<div id="debug">cargando...</div>
<div id="fps-box">FPS —</div>

<script>
const { Engine, Runner, Bodies, Composite } = Matter;

const WALL         = 40;
const RADIUS_MAX   = 44;
const RADIUS_MIN   = 22;
const NUM_BALLS    = 20;
const RESTITUTION  = 0.88;
const FRICTION     = 0.0005;
const FRICTION_AIR = 0.003;
const ALPHA        = 0.18;

let W, H;
let engine, runner;
let balls = [];
let ctx2d, glState;
let ax = 0, ay = 0, az = 0;
let sensorOk = false;
let fps = 0, lastTime = performance.now(), frameCount = 0;
let drawLoopId = null;
let hasGoneLandscape = false;

// ── Orientation ────────────────────────────────────────────────────────────
function getOrientAngle() {
  if (screen.orientation && screen.orientation.angle !== undefined)
    return screen.orientation.angle;
  return (window.orientation || 0);
}

function computeGravity(rawAx, rawAy) {
  const G   = 9.8;
  const ang = ((getOrientAngle() % 360) + 360) % 360;
  let gx, gy;
  if      (ang < 45 || ang >= 315) { gx =  rawAx / G; gy = -rawAy / G; }  // portrait
  else if (ang < 135)              { gx =  rawAy / G; gy =  rawAx / G; }  // landscape-sec
  else if (ang < 225)              { gx = -rawAx / G; gy =  rawAy / G; }  // portrait-inv
  else                             { gx = -rawAy / G; gy = -rawAx / G; }  // landscape-pri
  return { gx, gy };
}

// ── Debug ──────────────────────────────────────────────────────────────────
const dbg    = document.getElementById('debug');
const fpsBox = document.getElementById('fps-box');
const rotMsg = document.getElementById('rotate-msg');

function fmt1(n) { const s = (+n).toFixed(1); return s==='-0.0'?'0.0':s; }
function fmt2(n) { const s = (+n).toFixed(2); return s==='-0.00'?'0.00':s; }
function fmt0(n) { const s = (+n).toFixed(0); return s==='-0'?'0':s; }
function dg(l,v) { return `<span class="dg"><span class="dl">${l}</span><span class="dv">${v}</span></span>`; }
const ds = '<span class="ds">|</span>';

function updateDebug() {
  const b   = balls[0]?.body;
  const bx  = b ? fmt0(b.position.x) : '--';
  const by  = b ? fmt0(b.position.y) : '--';
  const vx  = b ? fmt1(b.velocity.x) : '--';
  const vy  = b ? fmt1(b.velocity.y) : '--';
  const spd = b ? fmt1(Math.hypot(b.velocity.x, b.velocity.y)) : '--';
  const gx  = engine ? fmt2(engine.gravity.x) : '--';
  const gy  = engine ? fmt2(engine.gravity.y) : '--';
  dbg.innerHTML =
    dg('SNS', sensorOk?'✓':'✗') + ds +
    dg('ANG', getOrientAngle()) + ds +
    dg('AX', fmt1(ax)) + ds + dg('AY', fmt1(ay)) + ds + dg('AZ', fmt1(az)) + ds +
    dg('GX', gx) + ds + dg('GY', gy) + ds +
    dg('POS', `${bx},${by}`) + ds +
    dg('VEL', `${vx},${vy}`) + ds +
    dg('SPD', spd);
  fpsBox.textContent = `FPS ${fps}`;
}

function tickFPS() {
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) { fps = frameCount; frameCount = 0; lastTime = now; }
}

// ── Browser UI ─────────────────────────────────────────────────────────────
function hideBrowserUI() {
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen({ navigationUI:'hide' }).catch(()=>{});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  window.scrollTo(0,1);
  setTimeout(() => window.scrollTo(0,1), 300);
}

function lockLandscape() {
  if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(()=>{});
  if (screen.lockOrientation)    screen.lockOrientation('landscape');
  if (screen.mozLockOrientation) screen.mozLockOrientation('landscape');
  if (screen.msLockOrientation)  screen.msLockOrientation('landscape');
}

function checkOrientation() {
  if (hasGoneLandscape) { rotMsg.classList.remove('show'); return; }
  if (window.innerWidth > window.innerHeight) { hasGoneLandscape = true; rotMsg.classList.remove('show'); }
  else rotMsg.classList.add('show');
}

// ── WebGL ──────────────────────────────────────────────────────────────────
// Two-pass strategy:
//   Pass A  — one full-screen quad draws the grid background.
//   Pass B  — per ball: draw a tight quad covering only (centre ± radius+halo).
//             Alpha blending ON. Outside the disc the fragment is discarded
//             (alpha=0) so previous content shows through. This means each ball
//             can have its own halo without erasing the others.

function initGL() {
  const canvas = document.getElementById('gl');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('webgl', { alpha: false, premultipliedAlpha: false }) ||
            canvas.getContext('experimental-webgl', { alpha: false });
  if (!g) return null;

  // ── Background shader (full-screen quad, no ball) ────────────────────────
  const bgVsrc = `
    attribute vec2 aPos;
    varying   vec2 vUv;
    void main(){ vUv=aPos*.5+.5; gl_Position=vec4(aPos,0.,1.); }`;

  const bgFsrc = `
    precision mediump float;
    varying vec2 vUv;
    uniform vec2 uRes;
    float grid(vec2 px){
      float gs=34.; float lw=0.65;
      vec2 g=mod(px,gs);
      return max(smoothstep(lw+1.,lw,abs(g.y)), smoothstep(lw+1.,lw,abs(g.x)));
    }
    void main(){
      vec2 px=vUv*uRes; px.y=uRes.y-px.y;
      vec3 bgD=vec3(.040,.040,.072), bgL=vec3(.155,.195,.270);
      gl_FragColor=vec4(mix(bgD,bgL,grid(px)),1.);
    }`;

  // ── Ball shader ───────────────────────────────────────────────────────────
  // Draws one ball per call on a per-ball tight quad.
  // Clip-space coords of the quad corners are passed as aPos,
  // but we also get the fragment's screen-px via vPx.
  // Outside (disc+halo) → alpha=0 (discard), so blending leaves bg intact.
  const ballVsrc = `
    attribute vec2 aPos;   // clip-space quad corner
    varying   vec2 vPx;    // screen px of this fragment (Y from top)
    uniform   vec2 uRes;
    void main(){
      vPx = (aPos*.5+.5)*uRes;
      vPx.y = uRes.y - vPx.y;
      gl_Position=vec4(aPos,0.,1.);
    }`;

  const ballFsrc = `
    precision highp float;
    varying vec2  vPx;
    uniform vec2  uRes;
    uniform vec2  uBall;    // centre px (Y from top)
    uniform float uRadius;

    float grid(vec2 px){
      float gs=34.; float lw=0.65;
      vec2 g=mod(px,gs);
      return max(smoothstep(lw+1.,lw,abs(g.y)), smoothstep(lw+1.,lw,abs(g.x)));
    }
    vec3 bgColor(vec2 px){
      vec3 bgD=vec3(.040,.040,.072), bgL=vec3(.155,.195,.270);
      return mix(bgD,bgL,grid(px));
    }

    void main(){
      vec2  d    = vPx - uBall;
      float dist = length(d);
      float r    = uRadius;
      float haloW= r * 0.40;
      float outerR = r + haloW;

      // Fully outside halo → transparent, preserve background
      if(dist > outerR){ gl_FragColor=vec4(0.); return; }

      // ── Halo (between r and outerR) ──────────────────────────────────────
      if(dist > r){
        float t = (dist-r)/haloW;
        float h = exp(-t*t*4.5)*0.42;
        vec3 hCol = vec3(0.50,0.75,1.00);
        gl_FragColor = vec4(hCol*h, h);
        return;
      }

      // ── Inside ball — sphere refraction (Snell, n=1.55) ─────────────────
      float nd = dist/r;
      float nz = sqrt(max(0.,1.-nd*nd));
      vec3  N  = normalize(vec3(d/r, nz));
      vec3  I  = vec3(0.,0.,-1.);
      float eta   = 1./1.55;
      float cosI  = nz;
      float sin2T = eta*eta*(1.-cosI*cosI);
      vec2  bgOffset;
      if(sin2T>1.){
        // total internal reflection
        vec3 refl = I - 2.*dot(I,N)*N;
        bgOffset  = refl.xy * r * 1.5;
      } else {
        float cosT = sqrt(1.-sin2T);
        vec3  refr = eta*I + (eta*cosI-cosT)*N;
        float depth= 1.5*r;
        float t_hit= -depth/refr.z;
        bgOffset   = refr.xy * t_hit;
      }
      vec2 samplePx = clamp(uBall+bgOffset, vec2(0.), uRes);
      // flip Y for grid sampling
      vec2 sPx = vec2(samplePx.x, uRes.y-samplePx.y);
      vec3 col  = bgColor(sPx);

      // faint interior tint
      col += vec3(0.70,0.88,1.00)*0.05*(0.3+0.7*(1.-nz));

      // soft specular
      vec2 sp1 = d-vec2(-r*.36,-r*.36);
      col += vec3(1.)*exp(-dot(sp1,sp1)/(2.*(r*.19)*(r*.19)))*0.20;

      // tiny sharp dot
      vec2 sp2 = d+vec2(r*.20,r*.26);
      col += vec3(1.)*exp(-dot(sp2,sp2)/(2.*(r*.048)*(r*.048)))*0.45;

      // edge fade
      float edge = smoothstep(1.,0.90,nd);
      col = mix(bgColor(vPx), col, edge);

      gl_FragColor = vec4(col, edge);
    }`;

  function compile(type, src){
    const s=g.createShader(type);
    g.shaderSource(s,src); g.compileShader(s);
    if(!g.getShaderParameter(s,g.COMPILE_STATUS)){console.error(g.getShaderInfoLog(s));return null;}
    return s;
  }
  function makeProgram(vs,fs){
    const p=g.createProgram();
    g.attachShader(p,compile(g.VERTEX_SHADER,vs));
    g.attachShader(p,compile(g.FRAGMENT_SHADER,fs));
    g.linkProgram(p);
    if(!g.getProgramParameter(p,g.LINK_STATUS)){console.error(g.getProgramInfoLog(p));return null;}
    return p;
  }

  const bgProg   = makeProgram(bgVsrc,   bgFsrc);
  const ballProg = makeProgram(ballVsrc, ballFsrc);

  // Full-screen quad buffer
  const fsqBuf = g.createBuffer();
  g.bindBuffer(g.ARRAY_BUFFER, fsqBuf);
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), g.STATIC_DRAW);

  // Per-ball tight quad buffer (updated each draw)
  const ballBuf = g.createBuffer();

  return {
    g, bgProg, ballProg, fsqBuf, ballBuf,
    bg_aPos:    g.getAttribLocation(bgProg,   'aPos'),
    bg_uRes:    g.getUniformLocation(bgProg,  'uRes'),
    ball_aPos:  g.getAttribLocation(ballProg,  'aPos'),
    ball_uRes:  g.getUniformLocation(ballProg, 'uRes'),
    ball_uBall: g.getUniformLocation(ballProg, 'uBall'),
    ball_uRad:  g.getUniformLocation(ballProg, 'uRadius'),
  };
}

function renderGL() {
  if (!glState) return;
  const { g, bgProg, ballProg, fsqBuf, ballBuf,
          bg_aPos, bg_uRes,
          ball_aPos, ball_uRes, ball_uBall, ball_uRad } = glState;

  g.viewport(0,0,W,H);

  // ── Pass A: background grid ───────────────────────────────────────────────
  g.disable(g.BLEND);
  g.useProgram(bgProg);
  g.bindBuffer(g.ARRAY_BUFFER, fsqBuf);
  g.enableVertexAttribArray(bg_aPos);
  g.vertexAttribPointer(bg_aPos, 2, g.FLOAT, false, 0, 0);
  g.uniform2f(bg_uRes, W, H);
  g.drawArrays(g.TRIANGLE_STRIP, 0, 4);

  // ── Pass B: balls (largest first, so smaller ones appear on top) ──────────
  g.enable(g.BLEND);
  g.blendFunc(g.SRC_ALPHA, g.ONE_MINUS_SRC_ALPHA);
  g.useProgram(ballProg);
  g.uniform2f(ball_uRes, W, H);

  const sorted = [...balls].sort((a,b) => b.radius - a.radius);
  for (const { body, radius } of sorted) {
    const cx = body.position.x, cy = body.position.y;
    const ext = radius * 1.45;   // disc + halo in px

    // Convert tight AABB to clip space
    const x0 = (cx-ext)/W*2-1,  x1 = (cx+ext)/W*2-1;
    const y0 = 1-(cy+ext)/H*2,  y1 = 1-(cy-ext)/H*2;

    // Two triangles (TRIANGLE_STRIP): TL, TR, BL, BR
    const verts = new Float32Array([x0,y1, x1,y1, x0,y0, x1,y0]);
    g.bindBuffer(g.ARRAY_BUFFER, ballBuf);
    g.bufferData(g.ARRAY_BUFFER, verts, g.DYNAMIC_DRAW);
    g.enableVertexAttribArray(ball_aPos);
    g.vertexAttribPointer(ball_aPos, 2, g.FLOAT, false, 0, 0);

    g.uniform2f(ball_uBall, cx, cy);
    g.uniform1f(ball_uRad, radius);
    g.drawArrays(g.TRIANGLE_STRIP, 0, 4);
  }
}

// ── Build world ────────────────────────────────────────────────────────────
function buildWorld() {
  if (runner) Runner.stop(runner);
  if (engine) Composite.clear(engine.world, false);

  W = window.innerWidth;
  H = window.innerHeight;

  const c2d = document.getElementById('c2d');
  c2d.width = W; c2d.height = H;
  ctx2d = c2d.getContext('2d');

  const glCanvas = document.getElementById('gl');
  glCanvas.width = W; glCanvas.height = H;
  glState = initGL();

  engine = Engine.create({ gravity: { x:0, y:0, scale:0.001 } });
  engine.positionIterations   = 10;
  engine.velocityIterations   = 8;
  engine.constraintIterations = 4;

  const wo = { isStatic:true, restitution:RESTITUTION, friction:FRICTION };
  Composite.add(engine.world, [
    Bodies.rectangle(W/2,    H+WALL/2,   W+WALL*2, WALL,     wo),
    Bodies.rectangle(W/2,   -WALL/2,     W+WALL*2, WALL,     wo),
    Bodies.rectangle(-WALL/2,   H/2,     WALL, H+WALL*2,     wo),
    Bodies.rectangle(W+WALL/2,  H/2,     WALL, H+WALL*2,     wo),
  ]);

  balls = [];
  const cols = 5, rows = 4;
  const cellW = W/cols, cellH = H/rows;
  for (let i = 0; i < NUM_BALLS; i++) {
    const col = i%cols, row = Math.floor(i/cols);
    const radius = RADIUS_MIN + Math.random()*(RADIUS_MAX-RADIUS_MIN);
    const bx = cellW*(col+0.5) + (Math.random()-0.5)*cellW*0.5;
    const by = cellH*(row+0.5) + (Math.random()-0.5)*cellH*0.5;
    const rNorm = (radius-RADIUS_MIN)/(RADIUS_MAX-RADIUS_MIN);
    const body = Bodies.circle(bx, by, radius, {
      restitution: RESTITUTION - rNorm*0.08,
      friction: FRICTION, frictionAir: FRICTION_AIR, density: 0.002,
    });
    balls.push({ body, radius });
    Composite.add(engine.world, body);
  }

  runner = Runner.create();
  Runner.run(runner, engine);

  if (drawLoopId) cancelAnimationFrame(drawLoopId);
  drawLoop();
}

// ── Render loop ────────────────────────────────────────────────────────────
function drawLoop() {
  drawLoopId = requestAnimationFrame(drawLoop);
  tickFPS();

  const { gx, gy } = computeGravity(ax, ay);
  engine.gravity.x = gx;
  engine.gravity.y = gy;

  renderGL();

  const c = ctx2d;
  c.clearRect(0,0,W,H);

  // Corner brackets
  const br = 22;
  c.strokeStyle = 'rgba(0,255,120,0.11)';
  c.lineWidth = 1;
  [[0,0],[W,0],[0,H],[W,H]].forEach(([cx,cy]) => {
    const sx=cx===0?1:-1, sy=cy===0?1:-1;
    c.beginPath();
    c.moveTo(cx+sx*br,cy); c.lineTo(cx,cy); c.lineTo(cx,cy+sy*br);
    c.stroke();
  });

  // Trails
  for (const { body, radius } of balls) {
    const bx=body.position.x, by=body.position.y;
    const spd=Math.hypot(body.velocity.x,body.velocity.y);
    if (spd>1.5) {
      const nx=-body.velocity.x/spd, ny=-body.velocity.y/spd;
      const tl=Math.min(spd*3.5,70);
      const tg=c.createLinearGradient(bx,by,bx+nx*tl,by+ny*tl);
      tg.addColorStop(0,'rgba(180,220,255,0.15)');
      tg.addColorStop(1,'rgba(180,220,255,0)');
      c.beginPath();
      c.moveTo(bx+nx*radius*0.85,by+ny*radius*0.85);
      c.lineTo(bx+nx*tl,by+ny*tl);
      c.lineWidth=radius*0.6; c.lineCap='round';
      c.strokeStyle=tg; c.stroke();
    }
  }

  updateDebug();
}

// ── Accelerometer ──────────────────────────────────────────────────────────
function startSensor() {
  function onMotion(e) {
    const a=e.accelerationIncludingGravity;
    if(!a) return;
    ax=ax+ALPHA*((a.x||0)-ax);
    ay=ay+ALPHA*((a.y||0)-ay);
    az=az+ALPHA*((a.z||0)-az);
    sensorOk=true;
  }
  if (typeof DeviceMotionEvent!=='undefined' &&
      typeof DeviceMotionEvent.requestPermission==='function') {
    DeviceMotionEvent.requestPermission()
      .then(s=>{ if(s==='granted') window.addEventListener('devicemotion',onMotion); })
      .catch(()=>{});
  } else if (typeof DeviceMotionEvent!=='undefined') {
    window.addEventListener('devicemotion',onMotion);
  }
}

window.addEventListener('resize', ()=>{ checkOrientation(); buildWorld(); });

document.getElementById('btn-start').addEventListener('click', ()=>{
  lockLandscape();
  hideBrowserUI();
  document.getElementById('permission-overlay').style.display='none';
  checkOrientation();
  buildWorld();
  startSensor();
});
</script>
</body>
</html>
